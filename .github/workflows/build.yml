name: Build

# Compile l'application de bureau Windows sur les serveurs GitHub.
# Au push d'un tag vX.Y.Z : construit l'installateur ET le publie dans une
# Release GitHub (téléchargeable en permanence, double-clic direct).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Régénérer le bundle app.js depuis js/
        run: node scripts/bundle.js

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'installateur Windows (.exe)
        run: npm run dist
        env:
          # Distribution locale : on coupe la signature de code pour éviter le
          # téléchargement/extraction de winCodeSign (inutile et lent en CI).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Publier les artefacts (onglet Actions, 90 j)
        uses: actions/upload-artifact@v4
        with:
          name: gamecraft-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: warn

      # Publie une vraie Release GitHub avec l'installateur en pièce jointe.
      # Téléchargement permanent, directement installable en double-clic.
      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true

