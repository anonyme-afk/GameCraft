name: Build

# Compile l'application de bureau pour chaque OS sur les serveurs GitHub.
# Se déclenche sur publication d'un tag vX.Y.Z, ou manuellement.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Régénérer le bundle app.js depuis js/
        run: node scripts/bundle.js

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'exécutable / l'installateur
        run: npm run dist

      - name: Publier les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: gamecraft-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: warn
