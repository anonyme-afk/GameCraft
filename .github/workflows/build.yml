name: Build

# Compile l'application de bureau pour chaque OS sur les serveurs GitHub.
# Au push d'un tag vX.Y.Z : construit les installeurs ET les publie dans une
# Release GitHub (téléchargeables en permanence, double-clic direct).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Régénérer le bundle app.js depuis js/
        run: node scripts/bundle.js

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'exécutable / l'installateur
        run: npm run dist
        env:
          # Distribution locale : on coupe la signature de code pour éviter le
          # téléchargement/extraction de winCodeSign (inutile et lent en CI).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

      - name: Publier les artefacts (onglet Actions, 90 j)
        uses: actions/upload-artifact@v4
        with:
          name: gamecraft-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          if-no-files-found: warn

      # Publie une vraie Release GitHub avec les installeurs en pièces jointes.
      # Téléchargement permanent, directement installable en double-clic.
      - name: Publier la Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
          draft: false
          prerelease: false
          generate_release_notes: true

